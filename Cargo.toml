[package]
name = "key-switch-rs"
version = "0.1.0"
edition = "2024"
# MSRV: let-chains need 1.88 with edition 2024; the highest rust-version of
# any dependency is 1.85 (notify-types). The msrv job in
# .github/workflows/ci.yml builds with this version; keep the two in sync.
rust-version = "1.88"
description = "Keyboard remapping daemon for Windows: hotkeys, tap/hold gestures, chords, sequences and macros from a hot-reloaded RON config, driven by the swch CLI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bluesteelll/key-switch-rs"
homepage = "https://bluesteelll.github.io/key-switch-rs/"
readme = "README.md"
keywords = ["keyboard", "remap", "hotkey", "windows", "keybinding"]
categories = ["os::windows-apis", "command-line-utilities", "accessibility"]
build = "build.rs"

# The daemon. `test = false` keeps `cargo test` from building a unit-test
# harness out of src/main.rs: build.rs links the daemon with a
# `requireAdministrator` manifest, and that harness would inherit it and fail
# with "requires elevation" (os error 740) in a normal shell (KS-38).
# Limit: an explicit target selection overrides `test = false`. With
# `--release`, `--all-targets`, `--bins` or `--bin key-switch-rs` still build
# that elevated harness, and Cargo cannot keep `rustc-link-arg-bin` off a
# bin's own test target. Run plain `cargo test --release` instead. Debug
# builds embed no manifest, so `cargo test --all-targets` is fine.
# `swch` (src/bin/swch.rs) stays auto-discovered.
[[bin]]
name = "key-switch-rs"
path = "src/main.rs"
test = false

[build-dependencies]
# (no build-dependencies; manifest embedding is done via raw linker args
#  in build.rs so we can target a single binary, not all of them.)

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }
serde = { version = "1", features = ["derive"] }
ron = "0.10"
arc-swap = "1"
notify = "8"
interprocess = "2"
