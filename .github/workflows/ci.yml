# Formats, lints, tests and release-builds every push and pull request.
# The daemon is Windows-only, so every job runs on windows-latest. No job
# runs key-switch-rs.exe: the tests cover pure logic only.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run,
# except on master, where every commit gets a full result.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked
      - name: cargo build --release
        run: cargo build --release --locked
      # KS-38: `test = false` on the daemon binary keeps cargo from building
      # a unit-test harness out of src/main.rs, which would carry the
      # requireAdministrator manifest. This checks what cargo really builds;
      # --no-run builds the test executables and runs none of them.
      - name: "KS-38: no test harness for the daemon binary"
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          out=$(cargo test --release --no-run --locked 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          if grep -E 'unittests src[\\/]main\.rs' <<<"$out"; then
            echo "::error file=Cargo.toml::cargo test --release built a unit-test harness from src/main.rs; the key-switch-rs [[bin]] needs test = false (KS-38)"
            exit 1
          fi

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --all-targets --locked
