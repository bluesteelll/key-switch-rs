# Formats, lints, tests and release-builds every push and pull request.
# The daemon is Windows-only, so every job runs on windows-latest. No job
# runs key-switch-rs.exe: the tests cover pure logic only.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run,
# except on master, where every commit gets a full result.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked
      - name: cargo build --release
        run: cargo build --release --locked
      # KS-38: `test = false` and `bench = false` on the daemon binary keep
      # `cargo test` and `cargo bench` from building a libtest harness out of
      # src/main.rs, which would carry the requireAdministrator manifest.
      # This reads what cargo really builds from its JSON messages, not from
      # its human-readable output; --no-run builds the harnesses and runs
      # none of them.
      - name: "KS-38: no test or bench harness for the daemon binary"
        shell: pwsh
        run: |
          $offenders = @()
          foreach ($command in 'test --release', 'bench') {
            $cargoArgs = $command -split ' '
            $messages = & cargo @cargoArgs --no-run --locked --message-format=json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $harnesses = $messages |
              Where-Object { $_.StartsWith('{') } |
              ForEach-Object { $_ | ConvertFrom-Json } |
              Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test }
            foreach ($harness in $harnesses) {
              $kind = $harness.target.kind -join ','
              Write-Output "cargo $command --no-run: $($harness.target.name) ($kind) -> $($harness.executable)"
              if ($harness.target.name -eq 'key-switch-rs' -and $harness.target.kind -contains 'bin') {
                $offenders += "cargo $command"
              }
            }
          }
          foreach ($offender in $offenders) {
            Write-Output "::error file=Cargo.toml::$offender built a libtest harness from src/main.rs; the key-switch-rs [[bin]] needs test = false and bench = false (KS-38)"
          }
          if ($offenders.Count -gt 0) { exit 1 }

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --all-targets --locked
